name: Send push notifications

# Fires automatically whenever a new daily issue or deep-dive article is
# published (pushed to main). Sends a web push to every subscribed device
# via the Vercel backend in api/.
#
# Requires these repo secrets:
#   PUSH_API           base URL of the push backend, e.g. https://timps-postcards.vercel.app
#   PUSH_SEND_SECRET   shared secret; must equal PUSH_SEND_SECRET in Vercel env
#   SITE_URL           optional; public site base (defaults to GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - "daily/**.html"
      - "articles/**.html"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Find the newly published page
        id: find
        run: |
          files=$(git diff --name-only HEAD^ HEAD -- 'daily/*.html' 'articles/*.html' \
            | grep -v -E '(^|/)(index|archive|articles)\.html$' || true)
          if [ -z "$files" ]; then
            echo "No new issue or article in this push; nothing to send."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          file=$(printf '%s\n' "$files" | sort | tail -1)
          case "$file" in
            daily/*) type="issue" ;;
            articles/*) type="article" ;;
            *) type="update" ;;
          esac
          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "type=$type" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Pick the lead story
        if: steps.find.outputs.skip == 'false'
        env:
          FILE: ${{ steps.find.outputs.file }}
        run: |
          out=$(python3 - "$FILE" <<'PY'
          import re, sys, html
          doc = open(sys.argv[1], encoding="utf-8").read()

          def text(s):
              return re.sub(r"\s+", " ", html.unescape(re.sub(r"<[^>]+>", "", s))).strip()

          def grab(pat):
              m = re.search(pat, doc, re.S)
              return text(m.group(1)) if m else ""

          if sys.argv[1].startswith("daily/"):
              title = grab(r'<h2 class="card-headline lg">(.*?)</h2>') or grab(r'<h2 class="card-headline[^"]*">(.*?)</h2>')
              body = grab(r'<div class="card-deck">(.*?)</div>')
          else:
              title = grab(r'<h1 class="masthead-h">(.*?)</h1>')
              body = grab(r'<p class="masthead-dek">(.*?)</p>')

          if not title:
              m = re.search(r"<title>(.*?)</title>", doc, re.S)
              title = text(m.group(1)) if m else "TIMPS PostCards"
              title = re.sub(r"^TIMPS (?:PostCards|Articles)\s*[\u2014\u00b7-]\s*", "", title)

          def clip(s, n):
              return s if len(s) <= n else s[:n - 1].rstrip() + "\u2026"

          print(clip(title, 110))
          print(clip(body, 160))
          PY
          )
          {
            echo "title=$(printf '%s\n' "$out" | sed -n '1p')"
            echo "body=$(printf '%s\n' "$out" | sed -n '2p')"
          } >> "$GITHUB_OUTPUT"

      - name: Broadcast the push
        if: steps.find.outputs.skip == 'false'
        env:
          PUSH_API: ${{ secrets.PUSH_API }}
          PUSH_SEND_SECRET: ${{ secrets.PUSH_SEND_SECRET }}
          SITE_URL: ${{ secrets.SITE_URL }}
          FILE: ${{ steps.find.outputs.file }}
          TITLE: ${{ steps.find.outputs.title }}
          BODY: ${{ steps.find.outputs.body }}
        run: |
          if [ -z "$PUSH_API" ] || [ -z "$PUSH_SEND_SECRET" ]; then
            echo "Push not configured (PUSH_API / PUSH_SEND_SECRET missing); skipping."
            exit 0
          fi
          base="${SITE_URL:-https://sandeeprdy1729.github.io/TIMPS-PostCards}"
          base="${base%/}"
          jq -n --arg title "$TITLE" \
                --arg body "$BODY" \
                --arg url "$base/$FILE" \
                '{title:$title, body:$body, url:$url}' > payload.json
          echo "Sending push for $FILE"
          curl -sS -X POST "$PUSH_API/api/send" \
            -H "Content-Type: application/json" \
            -H "x-push-secret: $PUSH_SEND_SECRET" \
            --data @payload.json
