name: Send push notifications

# Fires automatically whenever a new daily issue or deep-dive article is
# published (pushed to main). Sends a web push to every subscribed device
# via the Vercel backend in api/.
#
# Requires these repo secrets:
#   PUSH_API           base URL of the push backend, e.g. https://timps-postcards.vercel.app
#   PUSH_SEND_SECRET   shared secret; must equal PUSH_SEND_SECRET in Vercel env
#   SITE_URL           optional; public site base (defaults to GitHub Pages)
#
# Use "Run workflow" (workflow_dispatch) to announce the most recently
# published page.

on:
  push:
    branches: [main]
    paths:
      - "daily/**.html"
      - "articles/**.html"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Find the newly published page
        id: find
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            last=$(git log -1 --format=%H -- 'daily/*.html' 'articles/*.html' || true)
            [ -z "$last" ] && last=HEAD
            files=$(git show --name-only --pretty=format: --diff-filter=A "$last" \
              -- 'daily/*.html' 'articles/*.html' || true)
          else
            files=$(git diff --name-only --diff-filter=A HEAD^ HEAD \
              -- 'daily/*.html' 'articles/*.html' || true)
          fi
          files=$(printf '%s\n' "$files" \
            | grep -v -E '(^|/)(index|archive|articles)\.html$' \
            | grep '\.html$' \
            | sort -r || true)
          if [ -z "$files" ]; then
            echo "No new issue or article in this push; nothing to send."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "file=$(printf '%s\n' "$files" | sort -r | sed -n '1p')" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Broadcast the push
        if: steps.find.outputs.skip == 'false'
        env:
          PUSH_API: ${{ secrets.PUSH_API }}
          PUSH_SEND_SECRET: ${{ secrets.PUSH_SEND_SECRET }}
          SITE_URL: ${{ secrets.SITE_URL }}
          FILE: ${{ steps.find.outputs.file }}
        run: |
          if [ -z "$PUSH_API" ] || [ -z "$PUSH_SEND_SECRET" ]; then
            echo "Push not configured (PUSH_API / PUSH_SEND_SECRET missing); skipping."
            exit 0
          fi
          base="${SITE_URL:-https://sandeeprdy1729.github.io/TIMPS-PostCards}"
          base="${base%/}"
          out=$(python3 .github/workflows/pick-title.py "$FILE")
          title=$(printf '%s\n' "$out" | sed -n '1p')
          body=$(printf '%s\n' "$out" | sed -n '2p')
          if [ -z "$title" ]; then
            echo "Could not extract a title from $FILE; nothing sent."
            exit 0
          fi
          jq -n --arg title "$title" \
                --arg body "$body" \
                --arg url "$base/$FILE" \
                '{title:$title, body:$body, url:$url}' > payload.json
          echo "Sending push for $FILE"
          curl -sS -X POST "$PUSH_API/api/send" \
            -H "Content-Type: application/json" \
            -H "x-push-secret: $PUSH_SEND_SECRET" \
            --data @payload.json